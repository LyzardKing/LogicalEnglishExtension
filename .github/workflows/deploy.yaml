on:
  push:
    branches:
      - main

name: Deploy Extension
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm install
          npm install -g vsce
      - name: Build and package with vsce
        run: |
          npm run package
          vsce package
      - name: Upload package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: logical-english-extension.vsix
          path: logical-english-extension.vsix
      - name: Upload to GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="prerelease-main"
          gh release view $TAG || gh release create $TAG logical-english-extension.vsix --prerelease --title "Pre-release from main" --notes "Automated build from main branch"
          gh release upload $TAG logical-english-extension.vsix --clobber

  publish:
    if: startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/prerelease-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: logical-english-extension.vsix
          path: .
      - name: Publish Extension
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: vsce publish -p $VSCE_TOKEN logical-english-extension.vsix